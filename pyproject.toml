[project]
name = "agents"
version = "0.1.0"
description = "Enterprise AI Agents Repository"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.3.13",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.9",
    "langchain-google-genai>=4.2.7",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.3.5",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.9",
    "langsmith>=0.10.4",
    "mcp>=1.28.1",
    "pandas>=3.0.3",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
]

[tool.pyright]
extraPaths = [
    "projects/01_WEATHER_AGENT",
    "projects/02_SRE_INCIDENT_ROUTER_AGENT",
    "projects/03_RAG_HYBRID_SEARCH",
    "projects/04_AUTOMATED_BLOG_RESEARCHER_WRITER",
    "projects/05_SELF_HEALING_CODE_DEBUGGER"
]
